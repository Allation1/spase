<!-- Головна торінка ГРИ -->
<!DOCTYPE html> <!-- Вказує, що це HTML5 документ -->
<html> <!-- Відкриває головний контейнер всієї сторінки -->
<head> <!-- Відкриває розділ з технічною інформацією -->
   <meta charset="UTF-8"> <!-- Встановлює кодування тексту для коректного відображення українських літер -->    
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Дозволяє сторінці правильно відображатися на різних пристроях -->
   <title>Моя гра</title> <!-- Встановлює назву сторінки, яка відображається у вкладці браузера -->
   <link rel="stylesheet" href="style.css"> <!-- Підключає файл зі стилями для цієї сторінки -->
   <link rel="stylesheet" href="ui-buttons.css"> <!-- Стиль контенера для кнопок -->
   <link rel="stylesheet" href="clock.css"> <!-- Стиль для годинника -->
   <link rel="stylesheet" href="science/research.css?v=13"> <!-- Стиль для наукової діяльності -->
   <link rel="stylesheet" href="planets/planet-list.css"> <!-- Стиль для планет -->
   <link rel="stylesheet" href="planets/planet.css"> <!-- Стиль для планет -->
   <link rel="stylesheet" href="planets/tera/tera.css"> <!-- Стиль для вікна Тери -->
   <link rel="stylesheet" href="map/map.css"> <!-- Стиль для карти -->
</head> <!-- Закриває розділ з технічною інформацією -->
<body> <!-- Відкриває розділ з вмістом сторінки, який бачить користувач -->
    <div id="clock"></div>
    <!-- Додаємо 10 кнопок -->
    <div id="buttons">
        <button id="settings-btn">⚙️</button>
        <button>🪐</button>
        <button>🗺️</button>
        <button>🌌</button>
        <button>🚀</button>
        <button>📜</button>
        <button>🤝</button>
        <button>🏗️</button>
        <button id="science-btn">🔬</button> <!-- Додаємо id для кнопки науки -->
        <button>🚪</button>
    </div>
    <!-- Порожнє динамічне вікно -->
    <div id="science-window" style="display:none;">
        <!-- Динамічні блоки наук будуть тут -->
    </div>
    <div id="planet-window" style="display:none;">
        <div class="planet-window-header">
            <div class="planet-window-title">Список планет</div>
            <button class="planet-close-btn" style="
                background: transparent;
                border: none;
                color: white;
                font-size: 1.2em;
                cursor: pointer;
                padding: 0 5px;
            ">✕</button>
        </div>
        <div class="planet-window-content">
            <div id="planet-list"></div> <!-- Додаємо цей контейнер -->
        </div>
    </div>
    <div id="map-window" style="display:none;">
        <button class="science-close-btn" onclick="closeMapWindow()">✕</button>
        <div class="science-window-title">Карта</div>
        <div id="space-map"></div> <!-- Контейнер для карти -->
    </div>
    <div id="fleet-window" style="display:none;">
        <button class="science-close-btn" onclick="closeFleetWindow()">✕</button>
        <div class="science-window-title">Флоти</div>
        <div class="fleet-content">
            <button id="create-fleet-btn" style="
                padding: 10px 20px;
                background: #1fa2c7;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                margin-bottom: 15px;
                width: 100%;
            ">➕ Створити флот</button>
            
            <div style="margin-bottom: 15px; padding: 10px; background: #134d5c; border: 1px solid #1fa2c7; border-radius: 4px;">
                <div style="font-weight: bold; color: #1fa2c7; margin-bottom: 10px;">📦 Кораблі у доці:</div>
                <div id="dock-ships-list" style="color: #aaa; font-size: 0.9em;">
                    <!-- Кораблі будуть відображені тут -->
                </div>
            </div>
            
            <div id="fleets-list" style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 15px;
            ">
                <!-- Флоти будуть відображені тут -->
            </div>
        </div>
    </div>
    <div id="create-fleet-window" style="display:none;">
        <div class="science-window-title">Створення флоту</div>
        <button class="science-close-btn" onclick="closeCreateFleetWindow()">✕</button>
        <div class="science-window-content" id="create-fleet-content">
            <!-- Форма створення флоту буде тут -->
        </div>
    </div>
    <div id="projects-window" style="display:none;">
        <div class="science-window-title">Проекти</div>
        <button class="science-close-btn" onclick="closeProjectsWindow()">✕</button>
        <div class="science-window-content" id="projects-content">
            <!-- Проекти будуть відображені тут -->
        </div>
    </div>
    <div id="ship-design-window" style="display:none;">
        <div class="science-window-title">Проектування корабля</div>
        <button class="science-close-btn" onclick="closeShipDesignWindow()">✕</button>
        <div class="science-window-content" id="ship-design-content">
            <!-- Форма проектування буде тут -->
        </div>
    </div>
    <div id="weapon-stats-window" style="display:none;">
        <div class="science-window-title">Характеристики зброї</div>
        <button class="science-close-btn" onclick="closeWeaponStatsWindow()">✕</button>
        <div class="science-window-content" id="weapon-stats-content">
            <!-- Характеристики будуть тут -->
        </div>
    </div>
    <div id="ship-stats-window" style="display:none;">
        <div class="science-window-title">Характеристики корабля</div>
        <button class="science-close-btn" onclick="closeShipStatsWindow()">✕</button>
        <div class="science-window-content" id="ship-stats-content">
            <!-- Характеристики будуть тут -->
        </div>
    </div>
    <script src="script.js"></script> <!-- Підключає файл з JavaScript кодом -->
    <script src="clock.js"></script>
    <script src="science/science-data-manager.js"></script>
    <script src="science/science-manager.js"></script>
    <script type="module" src="science/science-data.js"></script>
    <script src="settings-window.js"></script>
    <script type="module" src="science/science-ui.js?v=11"></script>
    <script src="science/tech-tree.js"></script>
    <script src="planets/planet-list.js"></script>
    <script type="module" src="planets/planet-data.js"></script>
    <script type="module" src="planets/planet-ui.js"></script>
    <script src="planets/tera/weapon-stats.js"></script>
    <script src="planets/tera/ship-builder.js"></script>
    <script src="planets/fleet-manager.js"></script>
    <script src="planets/tera/tera-window.js"></script>
    <script src="planets/tera/resource-updater.js"></script>
    <script src="map/map-list.js"></script>
    <script src="map/map-ui.js"></script>
    <script src="study-status.js"></script>
    
    <!-- Віджет версії гри -->
    <link rel="stylesheet" href="version.css">
    <div id="version-widget">
        <span id="version-label">v1.0.0</span>
        <div id="version-tooltip">
            <!-- Контент завантажується з version.json -->
        </div>
    </div>
    <script src="version.js"></script>
</body> <!-- Закриває розділ з вмістом сторінки -->
